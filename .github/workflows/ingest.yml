name: ingest

on:
  schedule:
    # Off-peak minutes: on-the-hour/half-hour slots are the most
    # congested on GitHub's best-effort cron scheduler (D7 reopen,
    # 2026-07-10 anchor FAIL at */30).
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "psycopg[binary]"
      - run: python scripts/ingest_snapshot.py
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
